<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미국 지수 ETF 비교 대시보드</title>
<style>
:root{--foreground:#171717;--muted-foreground:#737373;--muted:#efefef;--surface-primary:#f6f6f6;--border:#e5e5e5;--chart-1:#2563eb;--chart-4:#9333ea;--success:#059669;--radius:.625rem;--font-sans:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--foreground:#fafafa;--muted-foreground:#a3a3a3;--muted:#2a2a2a;--surface-primary:#1f1f1f;--border:#2e2e2e;--chart-1:#38bdf8;--chart-4:#c084fc;--success:#34d399}html{background:#141414}}
html{color:var(--foreground);font:14px/1.5 var(--font-sans)}
body{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;letter-spacing:-0.02em;margin:0 0 16px}
*{box-sizing:border-box}
.tabs{display:inline-flex;gap:4px;padding:3px;background:var(--muted);border-radius:var(--radius);margin-bottom:24px}
.tab{border:0;background:transparent;color:var(--muted-foreground);font:inherit;font-size:12px;padding:6px 14px;border-radius:calc(var(--radius) - 3px);cursor:pointer}
.tab.on{background:var(--surface-primary);color:var(--foreground);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:20px;margin-bottom:32px}
.label{color:var(--muted-foreground);font-size:11px}
.value{font-size:22px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.sub{font-size:11px;color:var(--muted-foreground)}
h3{font-size:13px;font-weight:600;margin:0 0 4px}
.sec{margin-bottom:28px}
.row{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;padding:5px 0;font-size:12px}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;background:var(--muted);border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px;width:0;transition:width .8s ease-out}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sp{background:var(--chart-1)}.nd{background:var(--chart-4)}
.na{color:var(--muted-foreground);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-weight:500;color:var(--muted-foreground);text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;vertical-align:top}
.wrap{overflow-x:auto}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:var(--muted);color:var(--muted-foreground);margin-left:4px}
.best{color:var(--success);font-weight:600}
.note{font-size:11px;color:var(--muted-foreground);line-height:1.6}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.card{background:var(--surface-primary);border-radius:var(--radius);padding:14px}
.card b{font-size:13px}
.card p{margin:6px 0 0;font-size:12px;color:var(--muted-foreground);line-height:1.5}
</style>
</head>
<body>
<h1>미국 지수 ETF 비교 (S&amp;P500 / 나스닥100)</h1>
<div class="tabs" id="tabs">
  <button class="tab on" data-k="all">전체</button>
  <button class="tab" data-k="sp">S&amp;P500</button>
  <button class="tab" data-k="nd">나스닥100</button>
</div>
<div class="stats" id="stats"></div>
<div class="sec"><h3>총보수 (연, 낮을수록 유리)</h3><div id="c-fee"></div></div>
<div class="sec"><h3>순자산 (조원)</h3><div id="c-aum"></div></div>
<div class="sec"><h3>일 거래대금 (억원)</h3><div id="c-vol"></div>
  <div class="note">S&amp;P500은 60일 평균, KODEX 나스닥100은 최근 하루 기준입니다. TIGER 나스닥100은 거래대금 수치를 확인하지 못했습니다.</div></div>
<div class="sec"><h3>상세 비교</h3><div class="wrap"><table id="tbl"></table></div></div>
<div class="pick" id="pick"></div>
<div class="note">실부담비용은 출처마다 값이 달라 표에서 뺐습니다. 최종 선택 전 금융투자협회 공시(dis.kofia.or.kr)에서 확인하세요. 모두 환노출형이고 연금저축·IRP·ISA에서 쓰면 과세이연됩니다. 기준: 2026.10 중순. 투자 권유가 아닙니다.</div>
<script>
const D=[
 {n:'ACE 미국S&P500',c:'360200',k:'sp',fee:0.0047,aum:4.0,vol:188,co:'한국투자신탁',list:'2020.08',te:'0.11%',pt:'최저 보수'},
 {n:'KODEX 미국S&P500',c:'379800',k:'sp',fee:0.0062,aum:9.4,vol:3523,co:'삼성',list:'2021.04',te:'0.09%',pt:'최고 유동성·추적오차'},
 {n:'KODEX 미국나스닥100',c:'379810',k:'nd',fee:0.0062,aum:10.3,vol:7319,co:'삼성',list:'2021.04',te:'-',pt:'나스닥 중 거래대금 1위'},
 {n:'TIGER 미국나스닥100',c:'133690',k:'nd',fee:0.0068,aum:12.1,vol:null,co:'미래에셋',list:'2010.10',te:'-',pt:'최대 규모·최장 이력'}
];
let key='all';
const f=v=>v==null?'-':v.toLocaleString('ko-KR');
function bars(id,field,fmt,max){
  const rows=D.filter(d=>key==='all'||d.k===key);
  const m=max||Math.max(...rows.map(r=>r[field]||0));
  document.getElementById(id).innerHTML=rows.map(r=>{
    const v=r[field];
    return `<div class="row"><div class="name">${r.n}</div><div class="track">${v==null?'':`<div class="fill ${r.k}" data-w="${v/m*100}"></div>`}</div><div class="num">${v==null?'<span class="na">확인 못 함</span>':fmt(v)}</div></div>`}).join('');
}
function render(){
  const rows=D.filter(d=>key==='all'||d.k===key);
  const minFee=Math.min(...rows.map(r=>r.fee));
  const maxAum=Math.max(...rows.map(r=>r.aum));
  const lowFee=rows.find(r=>r.fee===minFee), bigAum=rows.find(r=>r.aum===maxAum);
  document.getElementById('stats').innerHTML=
   `<div><div class="label">최저 총보수</div><div class="value">${minFee}%</div><div class="sub">${lowFee.n}</div></div>
    <div><div class="label">최대 순자산</div><div class="value">${maxAum}조</div><div class="sub">${bigAum.n}</div></div>
    <div><div class="label">종목 수</div><div class="value">${rows.length}</div><div class="sub">환노출형</div></div>`;
  bars('c-fee','fee',v=>v+'%',0.008);
  bars('c-aum','aum',v=>v+'조');
  bars('c-vol','vol',v=>f(v)+'억');
  document.getElementById('tbl').innerHTML=
   `<tr><th>종목</th><th>코드</th><th>운용사</th><th>상장</th><th>총보수</th><th>순자산</th><th>추적오차</th><th>특징</th></tr>`+
   rows.map(r=>`<tr><td><b>${r.n}</b></td><td>${r.c}</td><td>${r.co}</td><td>${r.list}</td><td class="${r.fee===minFee?'best':''}">${r.fee}%</td><td>${r.aum}조</td><td>${r.te}</td><td>${r.pt}</td></tr>`).join('');
  document.getElementById('pick').innerHTML=rows.map(r=>`<div class="card"><b>${r.n}</b><span class="tag">${r.k==='sp'?'S&P500':'나스닥100'}</span><p>${r.pt}</p></div>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(e=>e.style.width=e.dataset.w+'%')));
}
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b)return;
  key=b.dataset.k;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  render();
});
render();
</script>
</body>
</html>
